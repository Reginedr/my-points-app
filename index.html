<!doctype html><html lang='no'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#172b24'><link rel='manifest' href='manifest.webmanifest'><title>Poengjakten</title><style>body{font-family:system-ui;margin:0;background:#f3f6f4;color:#172b24}.wrap{max-width:680px;margin:auto;padding:24px}header{background:#172b24;color:white;padding:24px;border-radius:22px}.score{font-size:54px;font-weight:800}.card{background:white;margin-top:18px;padding:18px;border-radius:18px;box-shadow:0 4px 18px #0001}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#dff2e8;color:#0d5137;cursor:pointer}.minus button{background:#fae1e1;color:#7a2020}.log{font-size:14px;color:#53635c}.reset{background:#eee;color:#333;margin-top:16px}</style></head><body><main class='wrap'><header><div>POENGJAKTEN</div><div class='score'><span id='score'>0</span> poeng</div><div>Din personlige målkonkurranse</div></header><section class='card'><h2>Pluss</h2><div id='plus'></div></section><section class='card minus'><h2>Minus</h2><div id='minus'></div></section><section class='card'><h2>Historikk</h2><div id='log' class='log'>Ingen registreringer ennå.</div><button class='reset' onclick='resetAll()'>Nullstill alt</button></section></main><script>const rules=[['Treningsøkt',1],['Fullført bok',2],['10 000 skritt på en dag',1],['Holdt budsjett en dag',1],['Holdt kaloribudsjett en dag',1],['Hoppet over planlagt trening uten grunn',-1]];let data=JSON.parse(localStorage.getItem('poengjakten')||'{"score":0,"log":[]}');function save(){localStorage.setItem('poengjakten',JSON.stringify(data));render()}function add(name,p){data.score+=p;data.log.unshift({name,p,date:new Date().toLocaleString('no-NO')});save()}function render(){score.textContent=data.score;plus.innerHTML='';minus.innerHTML='';rules.forEach(([n,p])=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<span>${n}</span><button>${p>0?'+':''}${p}</button>`;d.querySelector('button').onclick=()=>add(n,p);(p>0?plus:minus).appendChild(d)});log.innerHTML=data.log.length?data.log.slice(0,30).map(x=>`<div class='item'><span>${x.name}<br><small>${x.date}</small></span><b>${x.p>0?'+':''}${x.p}</b></div>`).join(''):'Ingen registreringer ennå.'}function resetAll(){if(confirm('Vil du nullstille poeng og historikk?')){data={score:0,log:[]};save()}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
