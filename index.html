<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173128"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Poengjakten"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Poengjakten</title>
<style>
:root{--ink:#173128;--mint:#b7edcb;--bg:#f2f5f1;--green:#0d6a45;--rose:#8a2732;--muted:#66766f}*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}button{font:inherit}.wrap{max-width:680px;margin:auto;padding:18px 16px 48px}.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:26px;border-radius:28px;box-shadow:0 16px 40px #17312822}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#c9f5d9}.score{display:flex;align-items:end;gap:8px;margin-top:22px}.score strong{font-size:64px;line-height:.9}.score span{padding-bottom:6px}.sub{color:#d7eee1;margin-top:10px}.bar{height:12px;background:#ffffff20;border-radius:99px;overflow:hidden;margin-top:20px}.bar>div{height:100%;width:0;background:var(--mint);border-radius:99px;transition:width .5s}.range,.milestones{display:flex;justify-content:space-between;gap:6px;margin-top:8px;font-size:12px;color:#c9dbd1}.milestones{justify-content:flex-start;margin-top:16px}.pill{padding:6px 10px;border-radius:99px;background:#ffffff12}.pill.done{background:#ffd763;color:#4a3700;font-weight:800}.card{background:#fff;margin-top:16px;padding:20px;border-radius:24px;box-shadow:0 5px 18px #213c2c0c}.card h2{font-size:20px;margin:0}.hint{font-size:14px;color:var(--muted);margin:5px 0 12px}.item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid #edf0ee}.item:last-child{border:0}.label{font-weight:650}.date{font-size:12px;color:#87928d;margin-top:2px}.add{border:0;min-width:68px;padding:10px 12px;border-radius:12px;font-weight:850;background:#dff4e7;color:#0d6743;cursor:pointer}.add.minus{background:#fde5e7;color:var(--rose)}.add:disabled{background:#eef1ef;color:#9ca5a1;cursor:default}.points.pos{color:var(--green)}.points.neg{color:var(--rose)}details.card{padding:0}summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:20px;font-weight:800}summary::-webkit-details-marker{display:none}.past{padding:0 20px 14px;border-top:1px solid #edf0ee}.week{padding:15px 0;border-bottom:1px solid #edf0ee}.week:last-child{border:0}.weektop{display:flex;justify-content:space-between;font-weight:750}.empty{padding:18px 0;color:var(--muted);font-size:14px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#fff;color:var(--ink);padding:12px 18px;border-radius:99px;box-shadow:0 10px 30px #0003;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}.reset{border:0;background:transparent;color:#7a8781;text-decoration:underline;padding:12px 0 0;cursor:pointer;font-size:13px}@media(max-width:420px){.score strong{font-size:54px}.hero{padding:22px}}
</style></head><body><canvas id="fireworks"></canvas><main class="wrap"><header class="hero"><div class="eyebrow">Poengjakten</div><div class="score"><strong id="score">4</strong><span>poeng denne uka</span></div><div class="sub" id="status">11 poeng igjen til ukesmålet</div><div class="bar"><div id="progress"></div></div><div class="range"><span>Mandag</span><span>Mål: 15</span><span>Søndag</span></div><div class="milestones"><span class="pill" data-m="7">7 poeng</span><span class="pill" data-m="12">12 poeng</span><span class="pill" data-m="15">15 poeng</span></div></header>
<section class="card"><h2>Registrer i dag</h2><p class="hint">Hver aktivitet kan registreres én gang per dag.</p><div id="actions"></div></section>
<section class="card"><h2>Denne ukens historikk</h2><p class="hint" id="weekDates"></p><div id="currentLog"></div></section>
<details class="card"><summary><span>Tidligere uker</span><span>⌄</span></summary><div class="past" id="pastWeeks"></div></details>
<section class="card"><h2>Data</h2><p class="hint">Poengene lagres bare på denne enheten og i denne nettleseren.</p><button class="reset" id="reset">Nullstill alle data</button></section></main><div class="toast" id="toast"></div>
<script>
const RULES=[{id:'training',label:'Treningsøkt',points:1},{id:'book',label:'Fullført bok',points:2},{id:'steps',label:'10 000 skritt på en dag',points:1},{id:'budget',label:'Holdt budsjett en dag',points:1},{id:'calories',label:'Holdt kaloribudsjett en dag',points:1},{id:'missed',label:'Hoppet over planlagt trening uten grunn',points:-1}];
const KEY='poengjakten-v2';
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
function monday(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}function sunday(date=new Date()){const d=monday(date);d.setDate(d.getDate()+6);return d}
function weekKey(date=new Date()){return iso(monday(date))}function fmt(d){return new Intl.DateTimeFormat('no-NO',{day:'numeric',month:'short'}).format(new Date(d))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initialData(){let old=null;try{old=JSON.parse(localStorage.getItem('poengjakten')||'null')}catch(e){}const now=new Date(),wk=weekKey(now),entries=[];if(old&&Array.isArray(old.log)&&old.log.length){old.log.forEach((x,i)=>entries.push({id:'old-'+Date.now()+'-'+i,ruleId:'legacy',label:x.name||'Overført registrering',points:Number(x.p)||0,date:iso(now),time:x.date||'Fra forrige versjon'}))}else{const preserved=old&&Number.isFinite(Number(old.score))?Number(old.score):4;if(preserved)entries.push({id:'opening',ruleId:'legacy',label:'Overført fra forrige versjon',points:preserved,date:iso(now),time:'Startsaldo for denne uken'})}return{version:2,weeks:{[wk]:{entries,celebrated:[]}}}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initialData()}catch(e){data=initialData()}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function current(){const k=weekKey();if(!data.weeks[k])data.weeks[k]={entries:[],celebrated:[]};return data.weeks[k]}function total(w){return(w.entries||[]).reduce((s,e)=>s+Number(e.points||0),0)}
function render(){const wk=current(),score=total(wk),today=iso(new Date());document.getElementById('score').textContent=score;document.getElementById('progress').style.width=Math.max(0,Math.min(100,score/15*100))+'%';document.getElementById('status').textContent=score>=15?`Ukesmålet er nådd! ${score-15?score-15+' bonuspoeng så langt.':'Fantastisk jobbet.'}`:`${15-score} poeng igjen til ukesmålet`;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('done',score>=Number(x.dataset.m)));document.getElementById('weekDates').textContent=`${fmt(monday())}–${fmt(sunday())}`;
const used=new Set(wk.entries.filter(e=>e.date===today).map(e=>e.ruleId));document.getElementById('actions').innerHTML=RULES.map(r=>{const done=used.has(r.id);return `<div class="item"><div class="label">${esc(r.label)}</div><button class="add ${r.points<0?'minus':''}" data-id="${r.id}" ${done?'disabled':''}>${done?'Ført':(r.points>0?'+':'')+r.points}</button></div>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>add(b.dataset.id));
const log=[...wk.entries].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));document.getElementById('currentLog').innerHTML=log.length?log.map(e=>`<div class="item"><div><div class="label">${esc(e.label)}</div><div class="date">${esc(e.time||fmt(e.date))}</div></div><strong class="points ${e.points>=0?'pos':'neg'}">${e.points>0?'+':''}${e.points}</strong></div>`).join(''):'<div class="empty">Ingen registreringer denne uka ennå.</div>';
const past=Object.keys(data.weeks).filter(k=>k!==weekKey()).sort().reverse();document.getElementById('pastWeeks').innerHTML=past.length?past.map(k=>{const w=data.weeks[k],end=new Date(k+'T12:00:00');end.setDate(end.getDate()+6);const t=total(w);return `<div class="week"><div class="weektop"><span>${fmt(k)}–${fmt(end)}</span><span>${t} poeng</span></div><div class="date">${t>=15?'Målet nådd · '+(t-15)+' bonuspoeng':15-t+' poeng fra målet'} · ${w.entries.length} registreringer</div></div>`}).join(''):'<div class="empty">Ingen avsluttede uker ennå. Første sammendrag vises neste mandag.</div>';save()}
function add(id){const r=RULES.find(x=>x.id===id),wk=current(),today=iso(new Date());if(!r||wk.entries.some(e=>e.ruleId===id&&e.date===today))return;const before=total(wk);wk.entries.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),ruleId:r.id,label:r.label,points:r.points,date:today,time:new Intl.DateTimeFormat('no-NO',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date())});const after=total(wk);[7,12,15].forEach(m=>{if(before<m&&after>=m&&!wk.celebrated.includes(m)){wk.celebrated.push(m);setTimeout(()=>celebrate(m),100)}});save();render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function celebrate(level){toast(level===15?'15 poeng! Ukesmålet er nådd!':`${level} poeng! Nytt delmål nådd!`);fireworks(level===7?12:level===12?22:38)}
function fireworks(count){const c=document.getElementById('fireworks'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let ps=[];const colors=['#ffd166','#7ee8a9','#ff6b8a','#80c7ff','#c69cff'];for(let n=0;n<count;n++){const ox=innerWidth*(.15+Math.random()*.7),oy=innerHeight*(.15+Math.random()*.45);for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;ps.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:45+Math.random()*25,color:colors[Math.floor(Math.random()*colors.length)]})}}function frame(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.life--;x.globalAlpha=Math.max(0,p.life/60);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)});ps=ps.filter(p=>p.life>0);if(ps.length)requestAnimationFrame(frame);else x.clearRect(0,0,innerWidth,innerHeight)}frame()}
document.getElementById('reset').onclick=()=>{if(confirm('Vil du slette alle poeng og all historikk?')){localStorage.removeItem(KEY);localStorage.removeItem('poengjakten');data=initialData();save();render()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
