<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173128"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Poengjakten</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#173128;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px 16px 48px}.hero,.card{border-radius:26px;padding:22px;margin-bottom:16px}.hero{background:#173128;color:white;box-shadow:0 14px 35px #17312825}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:800;color:#c9f5d9}.score{font-size:58px;font-weight:900;margin-top:18px}.sub{color:#d8eee1}.bar{height:12px;margin-top:18px;background:#ffffff20;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#b7edcb;transition:.3s}.range{display:flex;justify-content:space-between;font-size:12px;color:#c9dbd1;margin-top:7px}.marks{display:flex;gap:7px;margin-top:16px}.mark{padding:6px 10px;border-radius:20px;background:#ffffff12;font-size:12px}.mark.done{background:#ffd763;color:#493600;font-weight:800}.card{background:white;box-shadow:0 5px 18px #213c2c0c}h2{margin:0;font-size:20px}.hint,.date{color:#718078;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf0ee}.row:last-child{border:0}.label{font-weight:650;flex:1}.btn,.undo{border:0;border-radius:12px;padding:9px 12px;font-weight:800}.btn{min-width:64px;background:#dff4e7;color:#0d6743}.btn.neg{background:#fde5e7;color:#8a2732}.btn:disabled{background:#eef1ef;color:#9ca5a1}.undo{background:#f0f2f1;color:#58655f;font-size:12px}.pos{color:#0d6a45}.negtext{color:#8a2732}details.card{padding:0}summary{padding:20px;cursor:pointer;font-weight:800}.past{padding:0 20px 15px;border-top:1px solid #eee}.empty{padding:15px 0;color:#718078}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:white;padding:12px 18px;border-radius:25px;box-shadow:0 10px 30px #0003;transition:.25s;z-index:5;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}canvas{position:fixed;inset:0;pointer-events:none;z-index:10;width:100%;height:100%}
</style></head><body><canvas id="fx"></canvas><main class="wrap"><header class="hero"><div class="eyebrow">POENGJAKTEN</div><div class="score"><span id="score">0</span> <small style="font-size:17px">poeng denne uka</small></div><div class="sub" id="status"></div><div class="bar"><div id="progress"></div></div><div class="range"><span>Mandag</span><span>Mål: 20</span><span>Søndag</span></div><div class="marks"><span class="mark" data-m="10">10 poeng</span><span class="mark" data-m="15">15 poeng</span><span class="mark" data-m="20">20 poeng</span></div></header><section class="card"><h2>Registrer i dag</h2><p class="hint">Hver aktivitet kan registreres én gang per dag.</p><div id="actions"></div></section><section class="card"><h2>Denne ukens historikk</h2><p class="hint" id="dates"></p><div id="log"></div></section><details class="card"><summary>Tidligere uker</summary><div class="past" id="past"></div></details></main><div class="toast" id="toast"></div><script>
const RULES=[['training','Treningsøkt',1],['book','Fullført bok',2],['steps','10 000 skritt på en dag',1],['budget','Holdt budsjett en dag',1],['calories','Holdt kaloribudsjett en dag',1],['missed','Hoppet over planlagt trening uten grunn',-1]],KEY='poengjakten-v3';
const iso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)},mon=d=>{d=new Date(d||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d},wk=()=>iso(mon()),fmt=d=>new Intl.DateTimeFormat('no-NO',{day:'numeric',month:'short'}).format(new Date(d));
function init(){let v2;try{v2=JSON.parse(localStorage.getItem('poengjakten-v2'))}catch(e){}if(v2&&v2.weeks)return{weeks:v2.weeks};let old;try{old=JSON.parse(localStorage.getItem('poengjakten'))}catch(e){}let entries=[];if(old?.log?.length)entries=old.log.map((x,i)=>({id:'old'+i,ruleId:'legacy',label:x.name,points:+x.p||0,date:iso(new Date()),time:x.date}));else entries=[{id:'opening',ruleId:'legacy',label:'Overført fra forrige versjon',points:+old?.score||4,date:iso(new Date()),time:'Startsaldo'}];return{weeks:{[wk()]:{entries,celebrated:[]}}}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||init()}catch(e){data=init()}function cur(){return data.weeks[wk()]||(data.weeks[wk()]={entries:[],celebrated:[]})}function total(w){return w.entries.reduce((s,e)=>s+(+e.points||0),0)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){let w=cur(),s=total(w),today=iso(new Date()),used=new Set(w.entries.filter(e=>e.date===today).map(e=>e.ruleId));score.textContent=s;status.textContent=s>=20?`Ukesmålet er nådd! ${s-20} bonuspoeng.`:`${20-s} poeng igjen til ukesmålet`;progress.style.width=Math.max(0,Math.min(100,s/20*100))+'%';document.querySelectorAll('[data-m]').forEach(e=>e.classList.toggle('done',s>=+e.dataset.m));let end=mon();end.setDate(end.getDate()+6);dates.textContent=`${fmt(mon())}–${fmt(end)}`;actions.innerHTML=RULES.map(r=>`<div class="row"><span class="label">${r[1]}</span><button class="btn ${r[2]<0?'neg':''}" data-add="${r[0]}" ${used.has(r[0])?'disabled':''}>${used.has(r[0])?'Ført':(r[2]>0?'+':'')+r[2]}</button></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));log.innerHTML=w.entries.length?[...w.entries].reverse().map(e=>`<div class="row"><div class="label">${e.label}<div class="date">${e.time||fmt(e.date)}</div></div><strong class="${e.points>=0?'pos':'negtext'}">${e.points>0?'+':''}${e.points}</strong>${e.ruleId!=='legacy'?`<button class="undo" data-undo="${e.id}">Angre</button>`:''}</div>`).join(''):'<div class="empty">Ingen registreringer ennå.</div>';document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undo(b.dataset.undo));let ks=Object.keys(data.weeks).filter(k=>k!==wk()).sort().reverse();past.innerHTML=ks.length?ks.map(k=>{let w=data.weeks[k],s=total(w),e=new Date(k+'T12:00');e.setDate(e.getDate()+6);return`<div class="row"><span>${fmt(k)}–${fmt(e)}</span><strong>${s} poeng</strong></div>`}).join(''):'<div class="empty">Ingen avsluttede uker ennå.</div>';save()}
function add(id){let r=RULES.find(x=>x[0]===id),w=cur(),today=iso(new Date());if(!r||w.entries.some(e=>e.ruleId===id&&e.date===today))return;let before=total(w);w.entries.push({id:(crypto.randomUUID?.()||Date.now()+''),ruleId:r[0],label:r[1],points:r[2],date:today,time:new Intl.DateTimeFormat('no-NO',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date())});let after=total(w);[10,15,20].forEach(m=>{if(before<m&&after>=m&&!w.celebrated.includes(m)){w.celebrated.push(m);setTimeout(()=>celebrate(m),100)}});render()}
function undo(id){let w=cur(),e=w.entries.find(x=>x.id===id);if(!e)return;w.entries=w.entries.filter(x=>x.id!==id);let s=total(w);w.celebrated=w.celebrated.filter(m=>s>=m);toastMsg(`Angret: ${e.label}`);render()}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)}function celebrate(m){toastMsg(m===20?'20 poeng! Ukesmålet er nådd!':`${m} poeng! Delmål nådd!`);fire(m===20?42:16)}function fire(n){let c=fx,x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let p=[],co=['#ffd166','#7ee8a9','#ff6b8a','#80c7ff'];for(let j=0;j<n;j++){let ox=innerWidth*(.15+Math.random()*.7),oy=innerHeight*(.15+Math.random()*.45);for(let i=0;i<12;i++){let a=Math.random()*6.28,s=2+Math.random()*5;p.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:45+Math.random()*20,c:co[Math.floor(Math.random()*co.length)]})}}(function f(){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.07;q.l--;x.globalAlpha=q.l/60;x.fillStyle=q.c;x.fillRect(q.x,q.y,4,4)});p=p.filter(q=>q.l>0);if(p.length)requestAnimationFrame(f)})()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
